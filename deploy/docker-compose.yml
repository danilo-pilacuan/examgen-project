# ============================================================
# docker-compose.yml — Remote deployment on 172.28.230.10
# (DGX H200 USFQ, user dpilacuan)
#
# DESIGN PRINCIPLES (to avoid damaging the institution's server):
#   1. EVERYTHING lives in ~/my_containers/exam/ (user directory).
#   2. Own ISOLATED network (does not use the host network).
#   3. STRICT CPU/memory LIMITS (never saturates the host).
#   4. restart: "no" — does NOT auto-start when the server boots.
#   5. No system paths mounted; only named volumes and directories
#      under the user's home.
#   6. Easy to remove: `down.sh` removes containers+volumes while
#      keeping the data in the home directory.
#
# PORTS (high range 39000+, to avoid clashing with other services):
#   - 39000 -> postgres (5432)
#   - 39001 -> open-webui (8080)
#   - 39002 -> exam-app / API (8000)
#   - 39003 -> latex-compiler (8080)
#   - 39004 -> embedding-service (8081)
#   - 39005 -> frontend (80)
#
# Start:    docker compose up -d --build
# Stop:     docker compose down            (removes containers+network)
# Cleanup:  docker compose down -v         (also removes volumes)
# ============================================================

x-exam-root: &exam_root /home/dpilacuan/my_containers/exam

services:
  # DB
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: exam_postgres_db
    restart: "no"
    environment:
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_password
      POSTGRES_DB: exam_generator_db
    ports:
      - "39000:5432"
    volumes:
      - /home/dpilacuan/my_containers/exam/data/postgres:/var/lib/postgresql/data

  # LaTeX compiler
  latex-compiler:
    build:
      context: /home/dpilacuan/my_containers/exam/projects/latex-compiler
      dockerfile: Dockerfile
    container_name: exam_latex_compiler
    restart: "no"
    ports:
      - "39003:8080"
    volumes:
      - /home/dpilacuan/my_containers/exam/data/agent_outputs:/app/output

  # Embeddings service (OpenAI-compatible)
  embedding-service:
    build:
      context: /home/dpilacuan/my_containers/exam/projects/embedding-service
      dockerfile: Dockerfile
    container_name: exam_embedding_service
    restart: "no"
    environment:
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_DEVICE: cpu
    ports:
      - "39004:8081"

  # Orchestrator app (FastAPI) — exposes the REST API + the agent
  exam-app:
    build:
      context: /home/dpilacuan/my_containers/exam
      dockerfile: projects/exam-app/Dockerfile
    container_name: exam_app
    restart: "no"
    environment:
      DATABASE_URL: postgresql://exam_user:exam_password@postgres-db:5432/exam_generator_db
      LATEX_COMPILER_URL: http://latex-compiler:8080/compile
      EMBEDDING_URL: http://embedding-service:8081/v1/embeddings
      OPENWEBUI_URL: http://open-webui:8080
      OPENWEBUI_PUBLIC_URL: http://172.28.230.10:39001
      OPENWEBUI_ADMIN_EMAIL: admin@localhost
      OPENWEBUI_ADMIN_PASSWORD: admin
      # USFQ LLM gateway (OpenAI-compatible)
      LLM_BASE_URL: https://ai.usfq.edu.ec/api/agents/llm/main/v1
      LLM_MODEL: zai-org/GLM-5.3-Flash
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in the environment or .env}
      # Root directory of the subjects' material
      MATERIAL_ROOT: /app/inputs
    ports:
      - "39002:8000"
    volumes:
      - /home/dpilacuan/my_containers/exam/data/agent_outputs:/app/output
      - /home/dpilacuan/my_containers/exam/data/inputs:/app/inputs
    depends_on:
      - postgres-db
      - latex-compiler
      - embedding-service

  # Own frontend (Vue 3 + nginx). Proxies /api, /ws and /output to exam-app.
  frontend:
    build:
      context: ../projects/frontend
      dockerfile: Dockerfile
    container_name: exam_frontend
    restart: "no"
    environment:
      # Same origin: the frontend nginx proxies /api, /ws and /output.
      VITE_API_URL: ""
      VITE_WS_URL: ""
    ports:
      - "39005:80"
    depends_on:
      - exam-app

  # OpenWebUI: legacy conversational interface (optional).
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: exam_open_webui
    restart: "no"
    ports:
      - "39001:8080"
    environment:
      OPENAI_API_BASE_URLS: http://exam-app:8000/v1
      OPENAI_API_KEYS: no-key
      WEBUI_AUTH: "false"
      WEBUI_SECRET_KEY: "ee95d3be2fee38ba92098420869c00ff4c15e457dbbf18518db9e0542f9b7724"
      ENABLE_PERSISTENT_CONFIG: "false"
      WEBUI_NAME: "Exam Generator"
      DEFAULT_MODELS: "exam-agent"
      USER_PERMISSIONS_CHAT_CONTROLS: "false"
      USER_PERMISSIONS_CHAT_VALVES: "false"
      USER_PERMISSIONS_CHAT_SYSTEM_PROMPT: "false"
      USER_PERMISSIONS_CHAT_PARAMS: "false"
      USER_PERMISSIONS_CHAT_MULTIPLE_MODELS: "false"
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      USER_PERMISSIONS_CHAT_TEMPORARY: "false"
      USER_PERMISSIONS_CHAT_TEMPORARY_ENFORCED: "false"
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: "true"
      USER_PERMISSIONS_CHAT_WEB_UPLOAD: "false"
      ENABLE_PLUGINS: "false"
      ENABLE_NOTES: "false"
      ENABLE_MEMORIES: "false"
      ENABLE_CHANNELS: "false"
      ENABLE_CALENDAR: "false"
      ENABLE_FOLDERS: "false"
      ENABLE_AUTOMATIONS: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      ENABLE_MESSAGE_RATING: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS: "false"
      DEFAULT_PROMPT_SUGGESTIONS: '[{"title":["What subjects","are registered?"],"content":"What subjects are registered?"},{"title":["Generate an exam","for Applied Economics"],"content":"Generate an exam for Applied Economics"},{"title":["Review questions","for Technical English"],"content":"Give me review questions for Technical English"},{"title":["Register a question","about elasticity"],"content":"Register a question about elasticity in Applied Economics"}]'
    volumes:
      - /home/dpilacuan/my_containers/exam/data/openwebui:/app/backend/data
      - /home/dpilacuan/my_containers/exam/docker/openwebui/custom.css:/app/backend/open_webui/static/custom.css:ro
    depends_on:
      - exam-app
