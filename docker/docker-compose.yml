services:
  # DB
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: exam_postgres_db
    restart: always
    environment:
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_password
      POSTGRES_DB: exam_generator_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # LaTeX compiler
  latex-compiler:
    build:
      context: ../projects/latex-compiler
      dockerfile: Dockerfile
    container_name: exam_latex_compiler
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ../data/agent_outputs:/app/output

  # Embeddings service (OpenAI-compatible)
  embedding-service:
    build:
      context: ../projects/embedding-service
      dockerfile: Dockerfile
    container_name: exam_embedding_service
    restart: always
    environment:
      EMBEDDING_MODEL: BAAI/bge-m3
      EMBEDDING_DEVICE: cpu
    ports:
      - "8081:8081"

  # Orchestrator app (FastAPI) — exposes the REST API + the OpenAI-compatible
  # conversational agent (/v1/chat/completions) for OpenWebUI.
  exam-app:
    build:
      context: ..
      dockerfile: projects/exam-app/Dockerfile
    container_name: exam_app
    restart: always
    env_file:
      - ../.env
    environment:
      # Inside the compose network, the DB and services use their names.
      DATABASE_URL: postgresql://exam_user:exam_password@postgres-db:5432/exam_generator_db
      LATEX_COMPILER_URL: http://latex-compiler:8080/compile
      EMBEDDING_URL: http://embedding-service:8081/v1/embeddings
      OPENWEBUI_URL: http://open-webui:8080
      OPENWEBUI_PUBLIC_URL: http://localhost:3000
      OPENWEBUI_ADMIN_EMAIL: admin@localhost
      OPENWEBUI_ADMIN_PASSWORD: admin
      # Root directory of the subjects' material (mounted at /app/inputs).
      MATERIAL_ROOT: /app/inputs
    ports:
      - "8000:8000"
    # Share the output directory with the latex-compiler to serve the PDFs,
    # and mount the material directory to store files uploaded in the chat.
    volumes:
      - ../data/agent_outputs:/app/output
      - ../data/inputs:/app/inputs
    depends_on:
      - postgres-db
      - latex-compiler
      - embedding-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Own frontend (Vue 3 + nginx). Proxies /api, /ws and /output to exam-app.
  frontend:
    build:
      context: ../projects/frontend
      dockerfile: Dockerfile
    container_name: exam_frontend
    restart: always
    environment:
      # Same origin: the frontend nginx proxies /api, /ws, /output and the
      # REST routes (/subjects, /exams, /questions). Empty = the bundle does
      # not set absolute URLs and the browser uses the current origin.
      VITE_API_URL: ""
      VITE_WS_URL: ""
    ports:
      - "3000:80"
    depends_on:
      - exam-app

  # OpenWebUI: legacy conversational interface ("legacy" profile).
  # Start with: docker compose --profile legacy up -d
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: exam_open_webui
    restart: always
    profiles:
      - legacy
    ports:
      - "3001:8080"
    environment:
      # Connects OpenWebUI with the agent as a custom provider.
      OPENAI_API_BASE_URLS: http://exam-app:8000/v1
      OPENAI_API_KEYS: no-key
      WEBUI_AUTH: "false"   # no login for the MVP (single user)
      # Stable secret key: keeps sessions valid across restarts
      WEBUI_SECRET_KEY: "ee95d3be2fee38ba92098420869c00ff4c15e457dbbf18518db9e0542f9b7724"

      # ===== "Production chat" mode =====
      # Force environment variables to win (not values persisted in DB)
      ENABLE_PERSISTENT_CONFIG: "false"
      # UI brand/identity
      WEBUI_NAME: "Exam Generator"
      # Pre-select the exam-agent on every new chat
      DEFAULT_MODELS: "exam-agent"
      # Hide the "Controls" button (agent, system prompt, parameters, valves)
      USER_PERMISSIONS_CHAT_CONTROLS: "false"
      USER_PERMISSIONS_CHAT_VALVES: "false"
      USER_PERMISSIONS_CHAT_SYSTEM_PROMPT: "false"
      USER_PERMISSIONS_CHAT_PARAMS: "false"
      # Restrict the selector: a single model per chat
      USER_PERMISSIONS_CHAT_MULTIPLE_MODELS: "false"
      # All users see all models (single-agent MVP)
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      # Hide temporary chat and other unwanted actions in production
      USER_PERMISSIONS_CHAT_TEMPORARY: "false"
      USER_PERMISSIONS_CHAT_TEMPORARY_ENFORCED: "false"
      # Allow ONLY file uploads in the chat (hide "Attach web page")
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: "true"
      USER_PERMISSIONS_CHAT_WEB_UPLOAD: "false"
      # Hide features not needed in production
      ENABLE_PLUGINS: "false"
      ENABLE_NOTES: "false"
      ENABLE_MEMORIES: "false"
      ENABLE_CHANNELS: "false"
      ENABLE_CALENDAR: "false"
      ENABLE_FOLDERS: "false"
      ENABLE_AUTOMATIONS: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      ENABLE_MESSAGE_RATING: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_IMAGE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      # Workspace access (hide models/knowledge/prompts/tools/skills)
      USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS: "false"
      USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS: "false"
      # Startup suggestions relevant to the exam generator
      DEFAULT_PROMPT_SUGGESTIONS: '[{"title":["What subjects","are registered?"],"content":"What subjects are registered?"},{"title":["Generate an exam","for Applied Economics"],"content":"Generate an exam for Applied Economics"},{"title":["Review questions","for Technical English"],"content":"Give me review questions for Technical English"},{"title":["Register a question","about elasticity"],"content":"Register a question about elasticity in Applied Economics"}]'
    volumes:
      - open_webui_data:/app/backend/data
      # Inject custom CSS (hide attachment options and the model selector)
      - ./openwebui/custom.css:/app/backend/open_webui/static/custom.css:ro
    depends_on:
      - exam-app

volumes:
  postgres_data:
  open_webui_data: