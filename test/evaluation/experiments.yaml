# Experiment definitions for the evaluation suite.
#
# An experiment compares one or more "arms" (configurations). Each arm:
#   - model_profile: key of models.yaml (which LLM to use)
#   - overrides:     hyperparameter overrides applied ON TOP of core defaults
#                    (any field of core.config.Settings is valid here)
# Each experiment also fixes the shared control variables:
#   - subjects:  which cloned subjects (subjects.yaml ids) every arm runs on
#   - repeats:   how many independent runs per (arm, subject)
#   - blueprint: which blueprint preset to use (defined in blueprints section)
#
# Hyperparameter-optimization experiments (E01/E02) vary exactly one knob
# while keeping everything else fixed — one-factor-at-a-time (OFAT) design.
experiments:
  - id: E01_temperature_sweep
    description: >
      Sensitivity of the generator to temperature (OFAT): 0.3 / 0.7 / 1.0.
      Measures quality, approval rate, diversity and cost per item.
    blueprint: baseline_8q
    subjects: [adam, bella, carlos]
    repeats: 3
    arms:
      - model_profile: glm-flash-default
        overrides: { llm_temperature: 0.3 }
      - model_profile: glm-flash-default
        overrides: { llm_temperature: 0.7 }
      - model_profile: glm-flash-default
        overrides: { llm_temperature: 1.0 }

  - id: E02_rag_topk_sweep
    description: >
      RAG retrieval depth (OFAT): top_k 1 / 3 / 8 with min_score fixed.
      Measures RAG quality (faithfulness, retrieval scores) vs cost (tokens per item).
    blueprint: baseline_8q
    subjects: [adam, bella, carlos]
    repeats: 3
    arms:
      - model_profile: glm-flash-default
        overrides:
          llm_temperature: 0.7
          retrieval_top_k: 1
      - model_profile: glm-flash-default
        overrides:
          llm_temperature: 0.7
          retrieval_top_k: 3
      - model_profile: glm-flash-default
        overrides:
          llm_temperature: 0.7
          retrieval_top_k: 8

  - id: E03_robustness_clones
    description: >
      Robustness: identical config across the 5 cloned subjects (same material,
      different names). Measures cross-clone variance of every metric family.
    blueprint: baseline_8q
    subjects: [adam, bella, carlos, diana, esteban]
    repeats: 2
    arms:
      - model_profile: glm-flash-default
        overrides: { llm_temperature: 0.7 }

  - id: E04_evaluator_temperature
    description: >
      Evaluator strictness (OFAT): evaluator temperature 0.0 / 0.2 / 0.6 with
      generator fixed. Measures approval rate and quality_score stability.
    blueprint: baseline_8q
    subjects: [adam, bella]
    repeats: 3
    arms:
      - model_profile: glm-flash-default
        overrides:
          llm_temperature: 0.7
          llm_temperature_evaluator: 0.0
      - model_profile: glm-flash-default
        overrides:
          llm_temperature: 0.7
          llm_temperature_evaluator: 0.2
      - model_profile: glm-flash-default
        overrides:
          llm_temperature: 0.7
          llm_temperature_evaluator: 0.6

# Blueprint presets shared by the experiments. Mirrors scripts/run_pipeline.py
# so results stay comparable with the historical manual runs.
blueprints:
  baseline_8q:
    total_questions: 8
    bloom_distribution:
      remember: 0.25
      understand: 0.25
      apply: 0.25
      analyze: 0.25
    difficulty_distribution:
      easy: 0.4
      medium: 0.4
      hard: 0.2
    topics_weight:
      Market Study: 0.3
      Financial Flows: 0.3
      Economic and Financial Analysis: 0.25
      Pricing: 0.15
    estimated_duration_minutes: 90
    retrieval:
      top_k: 3
      min_score: 0.15
      use_rag: true
      max_chars_per_chunk: 1200
